<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OTP Autofill form laboratory</title>
    <style>
      body {
        font-family: system-ui;
        background: #f4f6f1;
        color: #253e3c;
        margin: 40px auto;
        padding: 20px;
        max-width: 700px;
      }
      h1 {
        letter-spacing: -1px;
      }
      form,
      section {
        padding: 24px;
        background: white;
        border: 1px solid #dde4da;
        border-radius: 14px;
        margin: 18px 0;
      }
      input,
      button,
      select {
        font: inherit;
        padding: 12px;
        border: 1px solid #b8c8bb;
        border-radius: 7px;
        margin: 6px;
      }
      input {
        max-width: 240px;
      }
      fieldset {
        border: 0;
        padding: 0;
      }
      fieldset input {
        width: 42px;
        text-align: center;
        padding: 12px 3px;
      }
      label {
        display: block;
      }
      button {
        background: #28483d;
        color: white;
        cursor: pointer;
      }
      p {
        color: #65756b;
        line-height: 1.6;
      }
      .note {
        font-size: 13px;
      }
      output {
        display: block;
        margin-top: 16px;
        overflow-wrap: anywhere;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script src="/app.js"></script>
  </body>
</html>
